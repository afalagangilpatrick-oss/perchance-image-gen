[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "perchance-image-gen"
version = "0.2.0"
description = "Free Perchance text-to-image generator - standalone Python package and CLI"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "afalagangilpatrick-oss"}]
requires-python = ">=3.9"
dependencies = ["requests>=2.28"]
optional-dependencies = { playwright = ["playwright>=1.40"] }

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.scripts]
perchance-gen = "perchance_image_gen.cli:cli"
perchance-key-fetch = "perchance_image_gen.cli:main_fetch_key"

[project.urls]
Homepage = "https://perchance.org/ai-text-to-image-generator"

[tool.setuptools.packages.find]
where = ["."]
include = ["perchance_image_gen*"]
